version: 2

models:

  - name: dim_products
    description: "Product dimension table used for BI analysis and segmentation"
    columns:

      - name: product_id
        description: "Unique identifier of the product"
        tests:
          - not_null
          - unique

      - name: product_name
        description: "Name of the product"

      - name: category_name
        description: "Product category classification"

      - name: brand_name
        description: "Brand associated with the product"

      - name: list_price
        description: "Standard product price rounded to 2 decimals"

      - name: price_category
        description: "Derived segmentation based on product price"
        tests:
          - not_null


  - name: fct_sales
    description: "Fact table for sales analysis"
    columns:

      - name: order_id
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id

      - name: customer_id
        tests:
          - not_null

      - name: store_id
        tests:
          - not_null

      - name: staff_id
        tests:
          - not_null

      - name: revenue
        description: "Total revenue calculated as quantity * price"
